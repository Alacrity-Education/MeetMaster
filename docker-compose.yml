services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meetmaster
      POSTGRES_PASSWORD: meetmaster
      POSTGRES_DB: meetmaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmaster -d meetmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
